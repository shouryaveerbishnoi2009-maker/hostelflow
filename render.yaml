# HostelFlow — Render Blueprint Configuration
# Deploy directly to Render with a single click or Git push
services:
  - type: web
    name: hostelflow
    env: python
    region: oregon # or singapore for lower latency to India
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: DATABASE_URL
        sync: false
        # Important: Provide the Supabase Connection Pooler URI (port 6543) for IPv4 compatibility!
      - key: SECRET_KEY
        generateValue: true
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.11.9"
